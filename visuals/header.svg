<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-label="Assume an AI agent&#x27;s verifier is compromised: signed approval for restricted passes signature verification, but an independent inbox-only policy blocks execution."><rect width="1500" height="600" fill="white"/>
<style>text{font-family:Chalkboard,"Comic Sans MS",cursive}.small{font-family:Arial,Helvetica,sans-serif}</style>
<text x="58" y="80" font-size="48" fill="#242424" class="pen">AI agent verifier compromised. What stops execution?</text>
<text x="62" y="134" font-size="29" fill="#626262" class="pen">Allowed: write to inbox. Attacker requests: write to restricted.</text>
<text x="62" y="199" font-size="25" fill="#ad4239" class="pen">Assume prompt injection succeeds</text>
<path d="M 64 233 Q 220.70000000000002 228 407 232 L 405 421 Q 217.25 424 60 420 Z" stroke="#ad4239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M 67 236 Q 251.75000000000003 232 409 230 M 410 234 L 408 418" stroke="#ad4239" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="84" y="273" font-size="29" fill="#ad4239" class="pen">Compromised verifier</text>
<text x="89" y="319" font-size="32" fill="#242424" class="pen">APPROVE + SIGN</text>
<text x="88" y="371" font-size="28" fill="#242424" class="pen">write to restricted</text>
<path d="M423 325 Q449.5 320 476 326" stroke="#242424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M460 315 L476 326 L460 337" stroke="#242424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M 496 233 Q 663.74 228 863 232 L 861 421 Q 660.05 424 492 420 Z" stroke="#242424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M 499 236 Q 696.95 232 865 230 M 866 234 L 864 418" stroke="#242424" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="521" y="276" font-size="29" fill="#242424" class="pen">Valid signed request</text>
<text x="527" y="325" font-size="29" fill="#242424" class="pen">Signature check:</text>
<text x="636" y="375" font-size="34" fill="#242424" class="pen">PASS</text>
<path d="M883 325 L932 325 L932 253 L991 253" stroke="#242424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M976 243 L991 253 L976 263" stroke="#242424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="1014" y="238" font-size="29" fill="#242424" class="pen">No permission policy</text>
<text x="1014" y="287" font-size="30" fill="#ad4239" class="pen">Restricted write executes</text>
<path d="M932 325 L932 411 L991 411" stroke="#315f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M976 401 L991 411 L976 421" stroke="#315f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="1014" y="362" font-size="29" fill="#315f8c" class="pen">Independent policy:</text>
<text x="1014" y="402" font-size="32" fill="#315f8c" class="pen">inbox only</text>
<text x="1014" y="454" font-size="30" fill="#315f8c" class="pen">Restricted write blocked</text>
<path d="M70 536 L85 551 L112 520" stroke="#315f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="136" y="550" font-size="30" fill="#315f8c" class="pen">Control: a valid, approved write to inbox still succeeds.</text>
</svg>