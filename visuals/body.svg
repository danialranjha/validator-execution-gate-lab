<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-label="Two independent authorization checks: policy blocks a signed restricted action; signature verification blocks a forged allowed action; benign twin succeeds.">
<rect width="1400" height="1120" fill="#f7f3e9"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
<text x="56" y="58" font-size="18" fill="#4a6065" font-weight="700" class="">AUTHORIZATION LAB / FOUR-WAY ABLATION</text>
<text x="56" y="115" font-size="43" fill="#172d32" font-weight="700" class="">An approval is only the first check.</text>
<text x="56" y="159" font-size="25" fill="#4a6065" font-weight="400" class="">Hold the validator at YES. Inspect what actually reaches the sink.</text>
<rect x="56" y="200" width="1288" height="87" rx="16" fill="#e7e9df" stroke="none" stroke-width="2"/>
<text x="80" y="235" font-size="16" fill="#4a6065" font-weight="700" class="">PAIRED INPUT</text>
<text x="80" y="271" font-size="27" fill="#172d32" font-weight="700" class="">Same forced approval + signed action: append_note → restricted</text>
<rect x="56" y="322" width="613" height="184" rx="16" fill="#f1ded6" stroke="none" stroke-width="2"/>
<text x="80" y="359" font-size="18" fill="#a4372d" font-weight="700" class="">CONTROL / APPROVAL ONLY</text>
<text x="80" y="400" font-size="27" fill="#172d32" font-weight="700" class="">APPROVE</text>
<path d="M237 390 L292 390" stroke="#a4372d" stroke-width="3" fill="none"/>
<path d="M282 383 L292 390 L282 397" fill="none" stroke="#a4372d" stroke-width="3"/>
<text x="312" y="400" font-size="27" fill="#a4372d" font-weight="700" class="">APPEND</text>
<text x="80" y="448" font-size="25" fill="#a4372d" font-weight="700" class="">1 record enters the in-memory sink.</text>
<text x="80" y="484" font-size="22" fill="#4a6065" font-weight="400" class="">No independent scope check.</text>
<rect x="703" y="322" width="641" height="184" rx="16" fill="#dcece3" stroke="none" stroke-width="2"/>
<text x="727" y="359" font-size="18" fill="#126b59" font-weight="700" class="">INTERVENTION / TOKEN + POLICY</text>
<text x="727" y="400" font-size="24" fill="#172d32" font-weight="400" class="">Signature valid</text>
<path d="M910 390 L953 390" stroke="#126b59" stroke-width="3" fill="none"/>
<path d="M943 383 L953 390 L943 397" fill="none" stroke="#126b59" stroke-width="3"/>
<text x="974" y="400" font-size="24" fill="#126b59" font-weight="700" class="">Policy DENY</text>
<text x="727" y="448" font-size="25" fill="#126b59" font-weight="700" class="">0 records enter the sink.</text>
<text x="727" y="484" font-size="22" fill="#4a6065" font-weight="400" class="">The restricted resource is outside policy.</text>
<text x="56" y="565" font-size="30" fill="#172d32" font-weight="700" class="">Remove each check to see which one matters.</text>
<text x="56" y="602" font-size="21" fill="#4a6065" font-weight="400" class="">Observed sink appends / one attempt per cell</text>
<rect x="56" y="625" width="1288" height="249" rx="10" fill="#fffdf6" stroke="#c7d2cc" stroke-width="2"/>
<rect x="56" y="625" width="1288" height="62" rx="10" fill="#e7e9df" stroke="none" stroke-width="2"/>
<text x="80" y="665" font-size="23" fill="#172d32" font-weight="700" class="">FIXTURE</text>
<text x="655" y="665" font-size="23" fill="#172d32" font-weight="700" class="">Approval</text>
<text x="839" y="665" font-size="23" fill="#172d32" font-weight="700" class="">Token</text>
<text x="1015" y="665" font-size="23" fill="#172d32" font-weight="700" class="">Policy</text>
<text x="1198" y="665" font-size="23" fill="#172d32" font-weight="700" class="">Both</text>
<text x="80" y="729" font-size="25" fill="#172d32" font-weight="700" class="">Signed + restricted</text>
<text x="711" y="729" font-size="28" fill="#a4372d" font-weight="700" class="">1</text>
<text x="878" y="729" font-size="28" fill="#a4372d" font-weight="700" class="">1</text>
<text x="1050" y="729" font-size="28" fill="#126b59" font-weight="700" class="">0</text>
<text x="1227" y="729" font-size="28" fill="#126b59" font-weight="700" class="">0</text>
<path d="M80 749 L1320 749" stroke="#c7d2cc" stroke-width="2" fill="none"/>
<text x="80" y="791" font-size="25" fill="#172d32" font-weight="400" class="">Forged + allowed inbox</text>
<text x="711" y="791" font-size="28" fill="#a4372d" font-weight="700" class="">1</text>
<text x="878" y="791" font-size="28" fill="#126b59" font-weight="700" class="">0</text>
<text x="1050" y="791" font-size="28" fill="#a4372d" font-weight="700" class="">1</text>
<text x="1227" y="791" font-size="28" fill="#126b59" font-weight="700" class="">0</text>
<path d="M80 811 L1320 811" stroke="#c7d2cc" stroke-width="2" fill="none"/>
<text x="80" y="853" font-size="25" fill="#172d32" font-weight="400" class="">Benign twin: valid + inbox</text>
<text x="711" y="853" font-size="28" fill="#126b59" font-weight="700" class="">1</text>
<text x="878" y="853" font-size="28" fill="#126b59" font-weight="700" class="">1</text>
<text x="1050" y="853" font-size="28" fill="#126b59" font-weight="700" class="">1</text>
<text x="1227" y="853" font-size="28" fill="#126b59" font-weight="700" class="">1</text>
<text x="56" y="920" font-size="29" fill="#172d32" font-weight="700" class="">Signed ≠ permitted. Policy-permitted ≠ authenticated.</text>
<text x="56" y="959" font-size="24" fill="#4a6065" font-weight="400" class="">The benign twin succeeds in all four modes; the full gate is not “block all.”</text>
<path d="M56 994 L1344 994" stroke="#c7d2cc" stroke-width="2" fill="none"/>
<text x="56" y="1031" font-size="23" fill="#4a6065" font-weight="700" class="">Deterministic fixtures · No live LLM · In-memory sink</text>
<text x="56" y="1066" font-size="21" fill="#4a6065" font-weight="400" class="">Single-process logical boundary. No claim of production isolation or model robustness.</text>
<text x="56" y="1096" font-size="17" fill="#4a6065" font-weight="400" class="">Evidence: artifacts/run.json · signed_restricted / forged_allowed / benign_twin</text>
</svg>